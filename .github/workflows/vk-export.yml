name: VK wall export (read-only)
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/vk-export.yml', 'scripts/vk-export.py']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export wall
        env:
          VK_KEY: ${{ secrets.VK_KEY }}
        run: |
          if [ -z "$VK_KEY" ]; then echo "Нет секрета VK_KEY"; exit 1; fi
          python3 scripts/vk-export.py
      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vk-export
          git commit -m "Выгрузка стены ВК" || exit 0
          git push
