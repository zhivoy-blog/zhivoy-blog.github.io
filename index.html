<script>
// --- Тёмная/светлая тема ---
(function() {
var toggle = document.getElementById('theme-toggle');
var saved = localStorage.getItem('zhivoy-theme') || 'dark';
applyTheme(saved);

function applyTheme(theme) {
if (theme === 'light') {
document.documentElement.setAttribute('data-theme', 'light');
toggle.textContent = '☀️';
} else {
document.documentElement.removeAttribute('data-theme');
toggle.textContent = '🌙';
}
localStorage.setItem('zhivoy-theme', theme);
}

toggle.addEventListener('click', function() {
var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
applyTheme(current === 'light' ? 'dark' : 'light');
});
})();
</script>

<script>
// --- Фоновая сеть частиц: живёт сама по себе, а на десктопе реагирует на курсор ---
(function() {
var canvas = document.getElementById('bg-canvas');
var ctx = canvas.getContext('2d');
var W, H, particles = [];
var mouse = { x: null, y: null, active: false };
var PARTICLE_COUNT = window.innerWidth < 640 ? 40 : 80;
var LINK_DIST = 130;
var MOUSE_DIST = 150;

function resize() {
W = canvas.width = window.innerWidth;
H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function getLineColor() {
return getComputedStyle(document.documentElement).getPropertyValue('--line-color').trim() || '220, 225, 235';
}

function Particle() {
this.x = Math.random() * W;
this.y = Math.random() * H;
this.vx = (Math.random() - 0.5) * 0.4;
this.vy = (Math.random() - 0.5) * 0.4;
this.r = Math.random() * 1.5 + 1;
}
Particle.prototype.update = function() {
this.x += this.vx;
this.y += this.vy;
if (this.x < 0 || this.x > W) this.vx *= -1;
if (this.y < 0 || this.y > H) this.vy *= -1;

if (mouse.active) {
var dx = this.x - mouse.x;
var dy = this.y - mouse.y;
var dist = Math.sqrt(dx * dx + dy * dy);
if (dist < MOUSE_DIST) {
var force = (MOUSE_DIST - dist) / MOUSE_DIST;
this.x += (dx / dist) * force * 1.8;
this.y += (dy / dist) * force * 1.8;
}
}
};

for (var i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

window.addEventListener('mousemove', function(e) {
mouse.x = e.clientX;
mouse.y = e.clientY;
mouse.active = true;
});
window.addEventListener('mouseleave', function() {
mouse.active = false;
});

function draw() {
ctx.clearRect(0, 0, W, H);

for (var i = 0; i < particles.length; i++) {
particles[i].update();
ctx.beginPath();
ctx.arc(particles[i].x, particles[i].y, particles[i].r, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(0, 122, 255, 0.7)';
ctx.fill();
}

for (var a = 0; a < particles.length; a++) {
for (var b = a + 1; b < particles.length; b++) {
var dx = particles[a].x - particles[b].x;
var dy = particles[a].y - particles[b].y;
var dist = Math.sqrt(dx * dx + dy * dy);
if (dist < LINK_DIST) {
ctx.beginPath();
ctx.moveTo(particles[a].x, particles[a].y);
ctx.lineTo(particles[b].x, particles[b].y);
ctx.strokeStyle = 'rgba(' + getLineColor() + ', ' + (1 - dist / LINK_DIST) * 0.35 + ')';
ctx.lineWidth = 1;
ctx.stroke();
}
}
}

requestAnimationFrame(draw);
}
draw();
})();

(function() {
var feed = document.getElementById('feed');
var tagButtons = document.querySelectorAll('.tag-btn');
var searchInput = document.getElementById('search-input');
var allCards = [];
var currentTag = 'все';
var currentSearch = '';

function formatDate(dateString) {
var months = [
'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
];
var date = new Date(dateString);
var day = date.getDate();
var month = months[date.getMonth()];
var year = date.getFullYear();
return day + ' ' + month + ' ' + year;
}

function createCard(article) {
var card = document.createElement('article');
card.className = 'article-card';
card.setAttribute('data-tag', article.tag);
card.setAttribute('data-search', (article.title + ' ' + article.excerpt).toLowerCase());

var time = document.createElement('time');
time.className = 'article-date';
time.setAttribute('datetime', article.date);
time.textContent = formatDate(article.date);

var h2 = document.createElement('h2');
h2.textContent = article.title;

var excerpt = document.createElement('p');
excerpt.className = 'article-excerpt';
excerpt.textContent = article.excerpt;

var link = document.createElement('a');
link.className = 'read-more';
link.href = 'article-template.html?article=' + article.slug;
link.textContent = 'Читать полностью';

card.appendChild(time);
card.appendChild(h2);
card.appendChild(excerpt);
card.appendChild(link);
return card;
}

function applyFilter() {
var visibleCount = 0;
allCards.forEach(function(card) {
var matchesTag = currentTag === 'все' || card.getAttribute('data-tag') === currentTag;
var matchesSearch = currentSearch === '' || card.getAttribute('data-search').indexOf(currentSearch) !== -1;
if (matchesTag && matchesSearch) {
card.classList.remove('is-hidden');
visibleCount++;
} else {
card.classList.add('is-hidden');
}
});
var emptyMsg = document.getElementById('empty-search-msg');
if (visibleCount === 0) {
if (!emptyMsg) {
emptyMsg = document.createElement('p');
emptyMsg.id = 'empty-search-msg';
emptyMsg.className = 'feed-loading';
emptyMsg.textContent = 'Ничего не найдено.';
feed.appendChild(emptyMsg);
}
} else if (emptyMsg) {
emptyMsg.remove();
}
}

function setActiveButton(activeBtn) {
tagButtons.forEach(function(btn) {
btn.classList.remove('active-tag');
});
activeBtn.classList.add('active-tag');
}

tagButtons.forEach(function(btn) {
btn.addEventListener('click', function() {
currentTag = this.getAttribute('data-tag');
setActiveButton(this);
applyFilter();
});
});

searchInput.addEventListener('input', function() {
currentSearch = this.value.trim().toLowerCase();
applyFilter();
});

fetch('articles/manifest.json')
.then(function(response) {
if (!response.ok) throw new Error('Network error');
return response.json();
})
.then(function(articles) {
articles.sort(function(a, b) {
return new Date(b.date) - new Date(a.date);
});
feed.innerHTML = '';
if (articles.length === 0) {
feed.innerHTML = '<p class="feed-loading">Нет опубликованных статей.</p>';
return;
}
articles.forEach(function(article) {
var card = createCard(article);
allCards.push(card);
feed.appendChild(card);
});
applyFilter();
})
.catch(function() {
feed.innerHTML = '<p class="feed-error">⚠️ Не удалось загрузить статьи. Проверьте подключение к интернету.</p>';
});
})();
</script>
