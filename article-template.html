<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Живой ИИ</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23113154'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='bold' fill='%23007aff' text-anchor='middle'%3EЖ%3C/text%3E%3C/svg%3E">

<style>
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: #1a2230;
color: #d1d1d6;
text-align: center;
padding: 60px 20px
}
a { color: #007aff }
</style>
</head>
<body>

<!-- Эта страница больше не рендерит статьи — статьи переехали на articles/<slug>/,
     где у каждой есть собственные мета-теги (title/description/og:*). Этот файл
     остаётся только ради старых ссылок вида ?article=slug, гуляющих в соцсетях
     и поисковой выдаче: он сразу отправляет на новый адрес той же статьи. -->
<script>
(function() {
var slug = new URLSearchParams(window.location.search).get('article');
location.replace(slug ? 'articles/' + encodeURIComponent(slug) + '/' : 'index.html');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=index.html"></noscript>

<p>Переходим на статью…<br>Если перенаправление не сработало, <a href="index.html">откройте список статей</a>.</p>

</body>
</html>
